name: iOS CI

on:
  push:
    branches: [ "developper", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build project
      run: |
        xcodebuild build \
          -scheme SlipSense \
          -destination 'generic/platform=iOS' \
          -quiet
